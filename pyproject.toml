[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexagent"
version = "0.3.0"
description = "Dexterous UR5e + Tesollo DG5F-S manipulation on Newton/MuJoCo-Warp (RoboSimStudio), GPU only"
requires-python = ">=3.12"
# RoboSimStudio (Newton, Warp, MuJoCo-Warp, OVRTX) is the third-party/robosimstudio
# submodule. The environment is built from its lockfile; see README.md, Setup.
dependencies = [
    "mujoco>=3.10",
    "numpy>=2",
    "scipy>=1.12",
    "trimesh>=4",
    "imageio[ffmpeg]>=2.30",
]

[tool.setuptools.packages.find]
include = ["dexagent*"]

[tool.setuptools.package-data]
dexagent = ["assets/*.xml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
