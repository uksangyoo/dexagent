[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexagent"
version = "0.3.0"
description = "Dexterous UR5e + Tesollo DG5F-S manipulation on Newton/MuJoCo-Warp (RoboSimStudio), GPU only"
requires-python = ">=3.12"
# RoboSimStudio (Newton, Warp, MuJoCo-Warp) is the third-party/robosimstudio submodule:
# install it into the same environment with `pip install -e third-party/robosimstudio`.
dependencies = [
    "mujoco>=3.10",
    "numpy>=2",
    "scipy>=1.12",
    "trimesh>=4",
    "imageio[ffmpeg]>=2.30",
]

[project.optional-dependencies]
# The Cycles/OptiX snapshot renderer (dexagent.cycles_worker) runs in a separate bpy interpreter.
render = ["bpy==4.5.10"]

[tool.setuptools.packages.find]
include = ["dexagent*"]

[tool.setuptools.package-data]
dexagent = ["assets/*.xml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
